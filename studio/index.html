<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cnforge Studio</title>
<link rel="icon" id="fav" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* cnforge Studio: an editing suite. Quiet graphite panels, one ember accent, timecode type. */
:root{
  color-scheme:dark;
  --bg:#0c0d0f;--rail:#101114;--panel:#15171a;--panel2:#1b1e22;--panel3:#23272c;
  --line:#23262b;--line2:#2e3238;--line3:#3c4148;
  --text:#e8eaed;--muted:#9aa1aa;--dim:#6f7680;
  --accent:#ff7a2f;--accent-2:#ffa067;--accent-bg:#2a1a10;--accent-text:#ffd2b5;--ink:#130a04;
  --title:var(--accent);
  --low:#4c535d;--mid:#b07a4f;--high:#ff7a2f;
  --ok:#3fbf7f;--ready:#5b9bff;--idle:#6f7680;--warn:#f0b13d;--bad:#ef5047;
  --sans:'Inter Tight',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
  --r:10px;--r-sm:7px;
  --side:228px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
::selection{background:color-mix(in srgb,var(--accent) 40%,transparent)}
a{color:var(--text);text-underline-offset:3px}a:hover{color:#fff}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.hide{display:none!important}

/* ---------------------------------------------------------------- shell: sidebar + workspace */
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:20}
.logo{display:flex;align-items:center;gap:11px;padding:20px 18px 18px;text-decoration:none;color:var(--text)}
.logo .mark{width:34px;height:34px;flex:none;display:block}.logo .mark svg{width:100%;height:100%;display:block}
.logo .wm{display:flex;flex-direction:column;line-height:1}
.logo b{font-size:19px;font-weight:800;letter-spacing:-.02em}
.logo b i{font-style:normal;color:var(--accent)}
.logo small{font-family:var(--mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);margin-top:5px}
.snav{display:flex;flex-direction:column;gap:2px;padding:6px 10px}
.snav a{display:flex;align-items:center;gap:10px;min-height:36px;padding:0 10px;border-radius:var(--r-sm);text-decoration:none;color:var(--muted);font-weight:600;font-size:13.5px}
.snav a svg{flex:none;opacity:.85}
.snav a:hover{background:var(--panel2);color:var(--text)}
.snav a[aria-current=page]{background:var(--panel2);color:var(--text);box-shadow:inset 2px 0 0 var(--accent)}
.sgroup{margin:18px 20px 6px;font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.cur{margin:0 10px;padding:10px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line)}
.cur .ct{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cur .cm{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cur .btn{width:100%;margin-top:10px}
.sfoot{margin-top:auto;padding:14px 18px 18px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)}
.chip{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.3}
.chip .led{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 18%,transparent)}
.chip .led.off{background:var(--bad);box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 18%,transparent)}
.toplink{font-size:12.5px;font-weight:600;text-decoration:none;color:var(--muted)}
.toplink:hover{color:var(--text)}
.linkbtn{background:none;border:0;padding:0;cursor:pointer;text-align:left;font-family:inherit}
.linkbtn:disabled{cursor:default;color:var(--dim)}
.credit{font-size:11px;color:var(--dim)}
.credit a{color:var(--dim)}

.work{margin-left:var(--side);min-width:0}
header.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:16px;height:52px;padding:0 28px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav.steps{display:flex;align-items:center;gap:2px;font-size:13px}
.step{display:flex;align-items:center;gap:8px;height:52px;padding:0 12px;color:var(--dim);font-weight:600;text-decoration:none;position:relative}
a.step:hover{color:var(--text)}
.step .n{font-family:var(--mono);font-size:11px;width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line2)}
.step.done{color:var(--muted)}.step.done .n{background:var(--panel3);border-color:var(--panel3);color:var(--text)}
.step.now{color:var(--text)}.step.now .n{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:700}
.step.now::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;background:var(--accent)}
.step + .step::before{content:"";width:14px;height:1px;background:var(--line2);margin-right:6px;margin-left:-8px}
main{max-width:1480px;padding:28px 28px 96px}

/* ---------------------------------------------------------------- type, panels, controls */
h1{margin:0;font-size:28px;line-height:1.1;font-weight:700;letter-spacing:-.02em}
.sub{margin:6px 0 0;color:var(--muted);font-size:14px}
.proj{margin:0 0 6px;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.cols{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.colmain{flex:999 1 620px;min-width:0;display:flex;flex-direction:column;gap:16px}
.colside{flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:16px}
/* the Brief's settings column stays beside you and scrolls on its own, so Preview is always in reach */
.colside.sticky{position:sticky;top:72px;max-height:calc(100vh - 88px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--line3) transparent;padding-bottom:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.label{margin:0;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.label .ix{color:var(--accent)}
.side-h{margin:0 0 14px;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.center{text-align:center}
.note{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.tiny{font-size:12px;color:var(--dim)}
.kv{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:5px}
.opt-tag{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);border:1px solid var(--line2);border-radius:4px;padding:1px 5px}

.btn{min-height:36px;padding:0 14px;border-radius:var(--r-sm);background:var(--panel2);color:var(--text);border:1px solid var(--line2);font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--panel3);border-color:var(--line3);color:var(--text)}
.btn.sm{min-height:30px;padding:0 10px;font-size:12px}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}.btn.ghost:hover{background:var(--panel2);color:var(--text)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:700}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2);color:var(--ink)}
.btn.big{min-height:50px;font-size:15px;padding:0 20px;border-radius:var(--r)}
.btn.danger{color:#ffb0a8;border-color:#4b2522}.btn.danger:hover{background:#2a1513;border-color:#6b302a}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.two{flex-direction:column;gap:3px;padding-top:7px;padding-bottom:7px;line-height:1.1}
.btn.two .lbl{display:inline-flex;align-items:center;gap:8px}
.eta-b{font-family:var(--mono);font-size:11.5px;font-weight:500;opacity:.8;white-space:nowrap}
.btn.two .eta-b:empty{display:none}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.opt{min-height:30px;padding:0 11px;border-radius:6px;font-size:12.5px;font-weight:600;cursor:pointer;background:var(--panel2);color:var(--muted);border:1px solid var(--line2)}
.opt:hover{color:var(--text);border-color:var(--line3)}
.opt[aria-pressed=true]{background:var(--accent-bg);color:var(--accent-text);border-color:var(--accent)}
.optnum{display:inline-flex;align-items:center;gap:4px;padding:0 9px 0 4px;cursor:text}
.optnum input[type=number],.optnum input[type=number]:focus{width:52px;height:26px;border:0;border-radius:0;background:transparent;color:inherit;font:inherit;text-align:right;padding:0 2px;outline:none;box-shadow:none;-moz-appearance:textfield}
.optnum input::-webkit-outer-spin-button,.optnum input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.optnum input::placeholder{color:var(--dim);font-weight:500}
.optnum:focus-within{border-color:var(--accent)}
.seg.mini{flex-wrap:nowrap;gap:3px}
.seg.mini .opt{min-height:28px;padding:0 9px;font-size:12px}

textarea,select,input[type=number],input[type=text]{width:100%;padding:10px 12px;border-radius:var(--r-sm);background:var(--bg);border:1px solid var(--line2);color:var(--text);font:inherit;font-size:14px}
textarea{line-height:1.5;resize:vertical;min-height:84px}
textarea::placeholder,input::placeholder{color:var(--dim)}
textarea:focus,select:focus,input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
select{appearance:none;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
option{background:var(--panel2);color:var(--text)}
.field{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted)}
.flabel{display:block;margin:14px 0 7px;font-size:12.5px;color:var(--muted)}
#world{height:132px;min-height:100px}
#pname{font-weight:600}

/* ---------------------------------------------------------------- brief */
.drop{border:1px dashed var(--line3);border-radius:var(--r);padding:26px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;cursor:pointer;color:var(--muted);background:repeating-linear-gradient(-45deg,transparent 0 10px,rgba(255,255,255,.012) 10px 20px)}
.drop svg{color:var(--accent)}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-bg)}
.mksong{margin-top:14px;padding:14px;border:1px solid var(--line2);border-radius:var(--r);background:var(--panel2);display:flex;flex-direction:column;gap:10px}
.mksong .hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.mksong .hd b{font-size:14px}
.mksong details summary{cursor:pointer;color:var(--muted);font-size:12.5px}.mksong details textarea{margin-top:8px;min-height:120px}
#mknote{font-size:12.5px}
.songline{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-width:0}
#songname{font-weight:700;font-size:15px}
.wave{position:relative;margin-top:34px;height:96px;cursor:pointer;user-select:none;touch-action:none;background:linear-gradient(var(--line) 0 0) 0 50%/100% 1px no-repeat}
.wave .bars{display:flex;align-items:center;gap:2px;height:96px}
.wave .bars span{flex:1 1 0;min-width:0;border-radius:1px}
.wave .win{position:absolute;top:-6px;bottom:-6px;border:1.5px solid var(--accent);border-radius:6px;background:color-mix(in srgb,var(--accent) 7%,transparent)}
.wave .win::before,.wave .win::after{content:"";position:absolute;top:50%;margin-top:-12px;width:6px;height:24px;border-radius:3px;background:var(--accent)}
.wave .win::before{left:-4px}.wave .win::after{right:-4px}
.wave .win.drag{cursor:grab}.wave.dragging,.wave.dragging .win.drag{cursor:grabbing}
.wave .win .ring{display:none}
.wave .wl{position:absolute;top:-28px;font-family:var(--mono);font-size:11.5px;font-weight:500;white-space:nowrap;color:var(--accent-text);background:var(--accent-bg);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:4px;padding:1px 6px}
.wave .ph{position:absolute;top:-6px;bottom:-6px;width:2px;background:#fff;display:none;pointer-events:none}
.wave .ph::after{content:attr(data-t);position:absolute;top:6px;left:6px;padding:1px 5px;border-radius:4px;background:rgba(0,0,0,.75);color:#fff;font:500 11px var(--mono);white-space:nowrap}
.ticks{position:relative;height:18px;margin-top:10px;font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.ticks span{position:absolute}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.tile{text-align:left;padding:0;border-radius:8px;overflow:hidden;cursor:pointer;background:var(--panel2);border:1px solid var(--line2);display:flex;flex-direction:column;transition:border-color .12s}
.tile:hover{border-color:var(--line3)}
.tile[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tile .tx{padding:12px 12px 13px;display:flex;flex-direction:column;gap:1px}
.tile b{font-size:13px;font-weight:700}.tile small{font-size:11.5px;color:var(--dim);line-height:1.3}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.fmt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;min-height:70px;border-radius:8px;font-family:var(--mono);font-size:12px;font-weight:500;cursor:pointer;background:var(--panel2);color:var(--muted);border:1px solid var(--line2)}
.fmt:hover{color:var(--text);border-color:var(--line3)}
.fmt[aria-pressed=true]{background:var(--accent-bg);color:var(--accent-text);border-color:var(--accent)}
.fmt i{display:block;border:1.5px solid currentColor;border-radius:3px}
.tier{text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer;background:var(--panel2);border:1px solid var(--line2);width:100%}
.tier:hover{border-color:var(--line3)}
.tier[aria-pressed=true]{background:var(--accent-bg);border-color:var(--accent)}
.tier .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tier b{font-size:13.5px}
.tier .eta{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.tier[aria-pressed=true] .eta{color:var(--accent-text)}
.tier small{display:block;font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4}
.orow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px;padding:5px 0;border-top:1px solid var(--line);font-size:12.5px;font-weight:500;color:#c6cad0}
.orow:first-child,.ogroup + .orow{border-top:0}
.orow > span{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orow.sub > span{display:flex;align-items:center;gap:8px}
.orow.sub > span i{width:8px;height:8px;border-radius:2px;flex:none}
.orow select,.orow input{flex:none;width:auto;max-width:60%;height:30px;padding:0 28px 0 10px;font-size:12.5px;font-weight:500;border-radius:6px;background-color:var(--panel2);background-position:calc(100% - 14px) 50%,calc(100% - 9px) 50%}
.orow input{width:68px;padding:0 10px;text-align:right}
.outrow{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.ogroup{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);padding:14px 0 2px}
.ogroup:first-child{padding-top:4px}
.opts{display:flex;flex-direction:column;margin-top:6px}
.adv summary{cursor:pointer;display:flex;align-items:center;gap:8px;list-style:none;min-height:24px}
.adv summary .side-h{margin:0}
.adv summary::-webkit-details-marker{display:none}
.adv .car{margin-left:auto;color:var(--dim);transition:transform .15s;flex:none}
.adv[open] summary .car{transform:rotate(90deg)}
#mnote.warn,#charnote.warn{color:var(--warn)}
.cta{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.editbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:11px 14px;margin-bottom:18px;border-radius:var(--r);background:var(--accent-bg);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent-text);font-size:13px}
.editbar svg{color:var(--accent);flex:none}
.editbar span{flex:1 1 300px}
.editbar b{color:#fff}
.chars{display:flex;flex-wrap:wrap;gap:10px}
.charcard{position:relative;margin:0;width:118px;border-radius:8px;overflow:hidden;background:var(--panel2);border:1px solid var(--line2)}
.charcard img{display:block;width:100%;height:136px;object-fit:cover;background:var(--panel3)}
.charcard figcaption{display:flex;gap:6px;align-items:baseline;padding:6px 8px;font-size:11.5px;min-width:0}
.charcard figcaption b{color:var(--accent);font-family:var(--mono)}
.charcard figcaption span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.charcard .btn{position:absolute;top:5px;right:5px;min-height:24px;padding:0 7px;background:rgba(8,9,11,.75)}
.charadd{width:118px;min-height:166px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:8px;border:1px dashed var(--line3);background:none;color:var(--muted);font-weight:600;font-size:12.5px;cursor:pointer}
.charadd span{font-size:26px;line-height:1;color:var(--accent)}
.charadd:hover,.charadd.over{color:var(--text);border-color:var(--accent)}

/* ---------------------------------------------------------------- a video: viewer, panel and the song's timeline in one workspace */
main.ws{max-width:none;padding:0;height:calc(100vh - 53px);display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.wh{display:flex;align-items:center;gap:10px 16px;padding:12px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.wh .tt{min-width:0;flex:1 1 260px}
.wh h1{font-size:20px;display:flex;align-items:center;gap:10px;min-width:0}
.wh h1 span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wh .sub{margin-top:3px;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wh .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{flex:none;display:inline-flex;align-items:center;gap:7px;font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:99px;border:1px solid var(--line2);color:var(--muted)}
.pill.run{color:var(--accent-text);border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:var(--accent-bg)}
.pill.run::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);animation:blink 1.2s ease-in-out infinite}
.pill.ok{color:#8ce0b4;border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
@keyframes blink{50%{opacity:.25}}
.wprog{flex:1 1 100%;display:flex;align-items:center;gap:14px;font:12px var(--mono);color:var(--muted);flex-wrap:wrap}
.wprog .progress{flex:1 1 200px}
.wprog.stall{color:#f6d6a3}.wprog.stall a{color:#fff}
.progress{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.progress div{height:4px;background:var(--accent);transition:width .6s}
.banner{padding:12px 14px;border-radius:var(--r);background:color-mix(in srgb,var(--warn) 9%,transparent);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);color:#f6d6a3;margin-bottom:16px;font-size:13px}
.banner a{color:#fff}
.wmid{display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:0}
.viewer{display:flex;flex-direction:column;min-height:0;min-width:0;background:radial-gradient(ellipse at 50% 30%,#16181c 0,var(--bg) 70%)}
.screen{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:16px;position:relative;container-type:size}
.screen > video{border-radius:8px;background:#000;box-shadow:0 20px 60px rgba(0,0,0,.55);display:block;cursor:pointer;flex:none;margin:auto}
/* Fit fills the viewer at the video's shape, larger or smaller than its file; a percentage is that
   share of the file's own pixels and scrolls when it is larger than the viewer */
.screen > video.fit{width:min(100cqw,calc(100cqh * var(--var,var(--ar))));height:auto}
.screen.scaled{overflow:auto;justify-content:flex-start;align-items:flex-start}
.vscale{width:auto;min-height:28px;padding:0 28px 0 9px;font-size:12px;font-weight:600;border-radius:8px;background-color:var(--panel2);background-position:calc(100% - 14px) 50%,calc(100% - 9px) 50%}
/* before there is a cut: the shot under the playhead, its clip, its still or what the plan says */
.frame{width:min(100cqw,calc(100cqh * var(--ar)));aspect-ratio:var(--ar);border-radius:8px;overflow:hidden;background:var(--panel);border:1px solid var(--line2);box-shadow:0 20px 60px rgba(0,0,0,.55);position:relative;cursor:pointer}
.frame img,.frame video{width:100%;height:100%;object-fit:cover;display:block}
.frame .plan{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;padding:18px;background:repeating-linear-gradient(-45deg,var(--panel) 0 10px,var(--panel2) 10px 20px);font-size:13px;color:var(--muted)}
.frame .plan b{color:var(--text);font-size:16px}
.stag{position:absolute;left:16px;top:16px;font:11.5px var(--mono);color:var(--muted);background:rgba(0,0,0,.65);border:1px solid var(--line2);padding:3px 8px;border-radius:6px;pointer-events:none}
.transport{display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.ibtn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.ibtn:hover{background:var(--panel3)}
.ibtn.big{width:38px;height:38px;background:var(--text);color:var(--bg);border-color:var(--text);border-radius:50%}
.ibtn[disabled]{opacity:.4;cursor:not-allowed}
.ibtn svg{width:16px;height:16px}
.clock{font:13px var(--mono);color:var(--muted);min-width:118px}.clock b{color:var(--text);font-weight:500}
.grow{flex:1}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted);border:1px solid var(--line2);border-radius:99px;padding:4px 11px;cursor:pointer;background:none}
.toggle[aria-pressed=true]{color:var(--text);border-color:var(--bad);background:#2a1213}
.toggle .dot{width:7px;height:7px;border-radius:50%;background:var(--bad)}

.wpanel{border-left:1px solid var(--line);background:var(--rail);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 8px;flex:none}
.tabs button{background:none;border:0;padding:12px 12px 10px;font-weight:600;font-size:13px;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:6px}
.tabs button:hover{color:var(--text)}
.tabs button[aria-selected=true]{color:var(--text);border-bottom-color:var(--accent)}
.tabs .n{font:500 10.5px var(--mono);background:var(--accent);color:var(--ink);border-radius:99px;padding:0 6px}
.pbody{overflow:auto;min-height:0;flex:1;scrollbar-width:thin;scrollbar-color:var(--line3) transparent}
.psec{padding:14px 16px;border-bottom:1px solid var(--line)}
.plbl{font:10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:0 0 9px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.plbl a{color:var(--accent);text-decoration:none;letter-spacing:0;text-transform:none;font-size:11.5px}
.ihead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.ihead h2{margin:0;font-size:20px;letter-spacing:-.02em}
.ihead h2 span{color:var(--dim);font-weight:500}
.ihead .t{font:12px var(--mono);color:var(--muted)}
.prev{display:flex;gap:12px;margin-top:12px}
.prev .pic{width:112px;flex:none;aspect-ratio:var(--ar);max-height:200px;border-radius:8px;overflow:hidden;background:var(--panel3) center/cover;border:1px solid var(--line2)}
.prev .pic video{width:100%;height:100%;object-fit:cover;display:block}
.prev .meta{display:flex;flex-direction:column;gap:8px;min-width:0;font-size:13px}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tg{font:11.5px var(--mono);color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.tg.ac{color:var(--accent-text);border-color:color-mix(in srgb,var(--accent) 35%,transparent);background:var(--accent-bg)}
.who{display:flex;align-items:center;gap:8px}
.av{position:relative;aspect-ratio:1;border-radius:50%;background:var(--panel3) center/cover;box-shadow:0 0 0 2px var(--c,var(--line2));border:0;padding:0;flex:none}
.who .av{width:28px}
button.av{cursor:pointer}
.cast{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.av .ct{position:absolute;right:-5px;bottom:-4px;font:10px var(--mono);background:var(--bg);border:1px solid var(--line2);border-radius:99px;padding:0 4px;color:var(--muted)}
.kvs{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12.5px}
.kvs dt{font:10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding-top:2px}
.kvs dd{margin:0;color:#c6cad0}
.qc{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:10px 12px}
.qc .score{display:flex;align-items:center;gap:10px}
.qc .score b{font:600 18px var(--mono)}
.qc .meter{flex:1;height:6px;border-radius:99px;background:var(--panel3);overflow:hidden}
.qc .meter i{display:block;height:100%}
.flag{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--muted);margin-top:7px}
.flag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--bad);margin-top:6px;flex:none}
.flag.ok::before{background:var(--ok)}
.flag.dim::before{background:var(--dim)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.k{font:10.5px var(--mono);color:var(--dim);border:1px solid var(--line2);border-radius:4px;padding:0 4px;background:var(--bg);font-weight:500}
.takepicks{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.takepick{position:relative;width:74px;padding:0;border:2px solid var(--line2);border-radius:6px;background:var(--panel3);color:var(--text);cursor:pointer;overflow:hidden;font-size:11px;font-weight:600;text-align:left}
.takepick img,.takepick .noimg{display:block;width:100%;aspect-ratio:var(--ar);max-height:110px;object-fit:cover}
.takepick span{display:block;padding:3px 6px}
.takepick[aria-pressed=true]{border-color:var(--accent)}
.takepick i{position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.queue{display:flex;flex-direction:column;gap:6px}
.qi{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:6px 8px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel);cursor:pointer;text-align:left;width:100%;color:var(--text)}
.qi:hover{border-color:var(--line3)}
.qi b{font:600 12px var(--mono);color:var(--accent)}
.qi span{flex:1;min-width:0;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qi .x{color:var(--dim);padding:0 3px}.qi .x:hover{color:var(--text)}
.hbar{height:6px;background:var(--panel3);border-radius:99px;overflow:hidden;display:flex;margin:2px 0 10px}
.hbar i{display:block;height:100%}
.hrow{display:flex;justify-content:space-between;font-size:12.5px;padding:2px 0;color:var(--muted)}
.hrow b{font:600 12.5px var(--mono);color:var(--text)}
.stages{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.stages li{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--dim);padding:4px 0}
.stages li i{width:18px;height:18px;border-radius:4px;display:flex;align-items:center;justify-content:center;font:600 10px var(--mono);font-style:normal;border:1px solid var(--line3);flex:none}
.stages li .m{margin-left:auto;font:11px var(--mono)}
.stages li.done{color:var(--muted)}.stages li.done i{background:var(--ok);border-color:var(--ok);color:#06140c}
.stages li.now{color:var(--text);font-weight:600}.stages li.now i{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;font-size:12.5px}
.notes li{display:flex;gap:10px}.notes li i{font-style:normal;font-weight:700;flex:none}
.more summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--muted);list-style:none;margin-top:6px}
.more summary::-webkit-details-marker{display:none}
.more[open] summary{display:none}

/* the timeline: the song's parts, its waveform, every shot and who sings it */
.tl{border-top:1px solid var(--line);background:var(--rail);min-width:0}
.tlbar{display:flex;align-items:center;gap:8px 14px;padding:7px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);flex-wrap:wrap}
.tlbar .keys{color:var(--dim);display:flex;gap:10px;flex-wrap:wrap}
.zoom{display:flex;align-items:center;gap:6px;margin-left:auto}
.zoom input{width:110px;accent-color:var(--accent)}
.tlwrap{display:grid;grid-template-columns:64px minmax(0,1fr)}
.lanes{border-right:1px solid var(--line);font:10.5px var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.lanes div{display:flex;align-items:center;padding-left:12px}
.tscroll{overflow-x:auto;overflow-y:hidden;position:relative;scrollbar-color:var(--line3) transparent}
.tinner{position:relative}
.h-ruler{height:22px}.h-part{height:22px}.h-wave{height:46px}.h-shots{height:74px}.h-cast{height:14px}
.ruler{position:relative;border-bottom:1px solid var(--line);cursor:pointer}
.ruler span{position:absolute;top:0;height:100%;border-left:1px solid var(--line2);padding:3px 0 0 4px;font:10.5px var(--mono);color:var(--dim)}
.ruler span.minor{height:6px;top:auto;bottom:0;padding:0}
.parts{position:relative;cursor:pointer}
.part{position:absolute;top:3px;bottom:3px;border-radius:5px;font:10.5px var(--mono);padding:2px 7px;overflow:hidden;white-space:nowrap;color:var(--muted);background:var(--panel2);border:1px solid var(--line2)}
.part.loud{color:var(--accent-text);background:var(--accent-bg);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
canvas.twave{display:block;height:46px;cursor:pointer}
.shots{position:relative}
.tshot{position:absolute;top:4px;bottom:4px;border-radius:6px;overflow:hidden;cursor:pointer;background:var(--panel3) center/cover;border:1px solid rgba(0,0,0,.5);padding:0}
.tshot::before{content:"";position:absolute;inset:0;background:linear-gradient(transparent 30%,rgba(0,0,0,.8))}
.tshot::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--accent)}
.tshot.broll::after{background:var(--ready)}
.tshot.planned{background:repeating-linear-gradient(-45deg,var(--panel) 0 6px,var(--panel2) 6px 12px)}
.tshot.still{filter:saturate(.35) brightness(.8)}
.tshot .n{position:absolute;left:4px;bottom:3px;font:600 10.5px var(--mono);color:#fff;text-shadow:0 1px 2px #000}
.tshot .fl{position:absolute;right:4px;top:7px;width:7px;height:7px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px rgba(0,0,0,.6)}
.tshot .re{position:absolute;right:3px;bottom:3px;font:700 10px var(--mono);color:var(--ink);background:var(--accent);border-radius:4px;padding:0 3px}
.tshot .re.go{animation:blink 1.2s ease-in-out infinite}
.tshot.sel{outline:2px solid var(--text);outline-offset:1px;z-index:2}
.tshot.picked{box-shadow:inset 0 0 0 2px var(--accent)}
.tshot.now{box-shadow:0 0 0 2px var(--accent),0 0 14px color-mix(in srgb,var(--accent) 55%,transparent);z-index:3}
.tshot .nw{position:absolute;left:3px;top:7px;max-width:calc(100% - 6px);display:flex;align-items:center;gap:3px;font:700 9.5px var(--mono);color:var(--ink);background:var(--accent);border-radius:4px;padding:0 4px;white-space:nowrap;overflow:hidden}
.tshot .nw::before{content:"";flex:none;width:5px;height:5px;border-radius:50%;background:currentColor;animation:blink 1.2s ease-in-out infinite}
.tshot.now:not(.sel){outline:1px solid rgba(255,255,255,.45)}
.tinner.weak .tshot:not(.flagged){opacity:.25;filter:grayscale(1)}
.castl{position:relative}
.castl i{position:absolute;top:3px;height:6px;border-radius:99px}
.tph{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--text);pointer-events:none;z-index:5}
.tph::before{content:"";position:absolute;left:-7px;top:0;border:6px solid transparent;border-top:8px solid var(--text)}
.ttip{position:fixed;z-index:30;pointer-events:none;background:var(--panel2);border:1px solid var(--line3);border-radius:8px;padding:6px 9px;font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.6);max-width:260px}
.ttip b{font-family:var(--mono)}

/* the Finish tab: FX, grade, grain, vignette and the 9:16 version */
.refine{display:flex;flex-direction:column;gap:8px;padding:14px 16px}
.refine .acc{padding:6px 14px}
.refine .acc.open{padding:6px 14px 14px;border-color:var(--accent)}
.refine .ed h3{margin:0;font-size:14px;font-weight:700}
.refine .acc.open h3{color:var(--accent-text)}
.acc-h{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:0;margin:0;color:inherit;text-align:left;cursor:pointer;min-height:36px}
.acc-sum{margin-left:auto;min-width:0;font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc.open .acc-sum{visibility:hidden}
.acc-h .chev{flex:none;color:var(--dim);transition:transform .15s}
.acc.open .acc-h .chev{transform:rotate(180deg)}
.acc-b{margin-top:8px}
.refine .ed .tiny{margin:0 0 12px}
.refine .vert .tiny{margin:6px 0 12px}
.fxrows{display:grid;gap:10px}
.fxrow{display:grid;gap:6px}
.fxlab{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600}
.fxlab i{width:8px;height:8px;border-radius:2px;display:inline-block}
.fxrow .seg{display:grid;grid-template-columns:repeat(3,1fr)}
.grades{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.grade{padding:0;border-radius:6px;overflow:hidden;cursor:pointer;background:var(--panel2);border:1px solid var(--line2);text-align:left;display:flex;flex-direction:column}
.grade[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.grade .gimg{display:block;aspect-ratio:16/9;background:linear-gradient(90deg,var(--panel2),var(--line2),var(--panel2));background-size:200% 100%;animation:shim 1.4s linear infinite}
.grade .gimg.ok{animation:none;background:#000}
.grade .gimg img{width:100%;height:100%;object-fit:cover;display:block}
.grade .gname{padding:5px 8px 6px;font-size:12px;font-weight:600}
@keyframes shim{to{background-position:-200% 0}}
.slider{display:grid;grid-template-columns:72px 1fr 64px;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);min-height:34px}
.slider input{width:100%;accent-color:var(--accent)}
.slider b{text-align:right;font-size:11.5px;color:var(--text);font-weight:500}
.grainprev{margin-top:10px;border-radius:6px;overflow:hidden;background:#000;aspect-ratio:16/9}
.grainprev img{width:100%;height:100%;object-fit:cover;display:block}
.applybar .btn{width:100%;min-height:46px;font-size:14px}
.applybar .btn:disabled{opacity:1;color:var(--dim);background:var(--panel);border-color:var(--line2)}

@media (max-width:1180px){.wmid{grid-template-columns:minmax(0,1fr) 320px}.tlbar .keys{display:none}}

/* ---------------------------------------------------------------- videos */
.fshots{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.fshot{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.fshot .th{position:relative;background:var(--panel2);display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:12px}
.fshot .th video{width:100%;height:100%;object-fit:cover;display:block}
.fshot .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.fshot .bd p{margin:0;color:var(--muted);line-height:1.45}
.fplayer{background:#000;border-radius:var(--r);overflow:hidden;display:flex;align-items:center;justify-content:center;max-height:70vh}
.fplayer video{max-width:100%;max-height:70vh;display:block}
.fplayer .ph{color:var(--muted);padding:60px 20px;text-align:center;font-size:13.5px}
.chip{display:inline-block;padding:1px 7px;border-radius:999px;background:var(--panel3);color:var(--muted);font-size:11px;margin-right:4px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.vcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-decoration:none;color:var(--text);display:flex;flex-direction:column;transition:border-color .12s,transform .12s}
.vcard:hover{border-color:var(--line3);color:var(--text);transform:translateY(-1px)}
.vcard{align-self:start}
.vcard .th{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--panel2)}.vcard .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 25%;display:block}
.vcard .bd{padding:11px 13px 13px}
.clamp,.clamp4{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.clamp4{-webkit-line-clamp:4}
.badge{display:inline-block;font:600 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;border-radius:4px;padding:2px 6px}
.badge.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:#8ce0b4}
.badge.run{background:var(--accent-bg);color:var(--accent-text)}
.badge.pre{background:var(--panel3);color:var(--muted)}

/* ---------------------------------------------------------------- overlay, toast, demo */
.overlay{position:fixed;inset:0;background:rgba(6,7,8,.84);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:50;padding:24px}
.overlay .box{max-width:520px;width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:26px 28px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.spin{width:38px;height:38px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--accent);animation:sp 1s linear infinite;margin:0 auto 16px}
@keyframes sp{to{transform:rotate(360deg)}}
.ovbar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin:18px 0 10px}
.ovbar div{height:4px;width:0;background:var(--accent);transition:width .8s}
.toast{position:fixed;left:calc(50% + var(--side) / 2);bottom:22px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line2);padding:11px 16px;border-radius:var(--r);z-index:60;font-size:13px;max-width:90vw;box-shadow:0 18px 50px rgba(0,0,0,.6)}
.demobar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:8px 28px;background:#1a1408;border-bottom:1px solid #4a3a14;font-size:12.5px;margin-left:var(--side)}
.demobar.hide{display:none}
.demobar b{color:var(--warn);letter-spacing:.06em;text-transform:uppercase;font-size:11px}
.demobar .dmn{color:var(--muted);flex:1 1 260px}
.demobar .dmgo{display:flex;flex-wrap:wrap;gap:6px}
.demobar button,.demobar select{font:inherit;font-size:12px;font-weight:600;color:var(--text);background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:4px 9px;cursor:pointer;max-width:260px}
.demobar button:hover,.demobar select:hover{border-color:var(--warn)}

/* ---------------------------------------------------------------- small screens: the sidebar becomes a top bar */
@media (max-width:900px){
  :root{--side:0px}
  .side{position:sticky;top:0;inset:auto;width:auto;height:auto;flex-direction:row;align-items:center;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .logo{padding:10px 12px}.logo small{display:none}.logo .mark{width:28px;height:28px}
  .snav{flex-direction:row;padding:0 4px}.snav a{min-height:34px;font-size:12.5px}
  .sgroup,.cur,.sfoot .credit{display:none}
  .snav a{white-space:nowrap}
  .sfoot{margin:0 0 0 auto;border:0;padding:0 12px;flex-direction:row}
  .sfoot .toplink,.chip > span:not(.led){display:none}
  /* a few hundred bars don't fit their 2px gaps on a phone: the gap becomes a transparent edge */
  .wave .bars{gap:0}.wave .bars span{border-right:1px solid transparent;background-clip:padding-box}
  header.top{top:55px;padding:0 16px;overflow-x:auto}

const SIM_W = {plan: 3, stills: 12, check: 5, clips: 55, takes: 15, broll: 5, edit: 5};  // as fv/studio.py weighs the stages

// Edit and resubmit: the run's brief (saved with it, or this browser's copy) into the Brief
async function editRun(run){
  let r;
  try{ r = await api("run/" + encodeURIComponent(run)); }catch(e){ toast(e.message); location.hash = "#/videos"; return; }
  const eb = r.edit_brief || store.get("briefs", {})[run];
  if (!eb){ toast("This video has no saved brief (it was started outside the Studio). The Brief keeps what it had.", 8000); history.replaceState(null, "", "#/"); route(); return; }
  S.brief = Object.assign({}, DEFAULT_BRIEF, eb);
  delete S.brief.render; delete S.brief.run_name;
  const w = WORLDS.find(x => x.text && x.text === S.brief.theme); S.brief.world = w ? w.id : "custom";
  S.analysis = null; saveBrief();
  S.editing = {run, name: projectOf(r) || eb.name || run, stage: r.stage}; store.set("editing", S.editing);
  history.replaceState(null, "", "#/"); route();
}
const runPage = e => "#/run/" + encodeURIComponent(e.run);

// ---------------------------------------------------------------- router
window.addEventListener("hashchange", route);
function route(){
  stopTimer();
  if (S.ws && S.ws.media) S.ws.media.pause();
  S.ws = null; window.onresize = null; $("#app").className = "";
  const h = location.hash.replace(/^#\/?/, "").split("/");
  const [page, run] = [h[0] || "", decodeURIComponent(h.slice(1).join("/") || "")];
  // on a run's screens ComfyUI opens with that run's Director graph (web/oneshot_mv.js loads it)
  const onRun = run && page === "run";
  $("#comfy").href = onRun ? "/?oneshot=" + encodeURIComponent(run) : "/";
  $("#comfy").title = onRun ? "Opens ComfyUI with the graph that made this video" : "";
  [["#nav-new", !page || page === "new"], ["#nav-videos", page === "videos"], ["#nav-film", page === "film" && !run]].forEach(([id, on]) => on ? $(id).setAttribute("aria-current", "page") : $(id).removeAttribute("aria-current"));
  if (!onRun) setCur(null);
  if (page === "edit" && run) return editRun(run);
  if (page === "new"){ S.editing = null; store.set("editing", null); history.replaceState(null, "", "#/"); return viewBrief(); }
  if (page === "run" && run) return viewRun(run);
  if (page === "videos") return viewVideos();
  if (page === "film") return run ? viewFilm(run) : viewFilmBrief();
  return viewBrief();
}

    $("#sys").innerHTML = `<span class="led" aria-hidden="true"></span><span>ComfyUI${s.gpu ? `<span class="gpu"> · ${esc(gpuName(s.gpu))}</span>` : ""}${q ? ` · ${q} in queue` : ""}</span>`;

// restart ComfyUI: always asked first, and more firmly when jobs are queued (a restart drops the
// queue and stops the running job); then the page waits for ComfyUI to go down and come back
async function restartComfy(){
  if (DEMO) return toast("Demo mode: ComfyUI isn't restarted.");
  let q = {running: 0, pending: 0};
  try{ q = (await api("system")).queue; }catch(e){}
  const busy = q.running + q.pending;
  const msg = busy
    ? `ComfyUI is busy: ${q.running} job${q.running === 1 ? "" : "s"} running, ${q.pending} waiting.\n\nRestarting stops the running job and drops every waiting one. A video that's rendering stops, and you'd resubmit it from its brief.\n\nRestart anyway?`
    : "Restart ComfyUI? It takes a minute or so; this page reloads when it's back.";
  if (!confirm(msg)) return;
  const btn = $("#restart"); btn.disabled = true; btn.textContent = "Restarting…";
  try{ await api("restart", {force: busy > 0}); }
  catch(e){ btn.disabled = false; btn.textContent = "Restart ComfyUI"; return toast(e.message); }
  stopTimer();
  $("#sys").innerHTML = `<span class="led off" aria-hidden="true"></span><span>ComfyUI restarting…</span>`;
  toast("Restarting ComfyUI. This page reloads when it's back.");
  const t0 = Date.now(); let wentDown = false;
  const poll = async () => {
    try{
      const r = await fetch("/oneshot-mv/api/system", {cache: "no-store"});
      if (r.ok && (wentDown || Date.now() - t0 > 20000)) return location.reload();
    }catch(e){ wentDown = true; }
    if (Date.now() - t0 > 600000){ btn.disabled = false; btn.textContent = "Restart ComfyUI"; return toast("ComfyUI didn't come back after 10 minutes: check its console."); }
    setTimeout(poll, 2000);
  };
  setTimeout(poll, 1500);
}

      : ` The clips are ${native} fps, so ${fps} now and then ${fps > native ? "repeats" : "drops"} a frame; ${native} is the smoothest.`;
    const big = (+b.resolution || 1080) > 1080 ? " Above 1080p the clips are scaled up: bigger files, not more detail." : "";
    $("#etanote").textContent = `${dsize(f)} at ${fps} fps.${motion}${big} Times are a rough guide for ${sec}${S.sys && S.sys.gpu ? " on " + gpuName(S.sys.gpu) : ""}.`;
    $("#fpss").innerHTML = [24, 25, 30, 50].map(x => `<button type="button" class="opt" data-v="${x}" aria-pressed="${fps === x}">${x}</button>`).join("");
    $("#ress").innerHTML = RES.map(([x, n]) => `<button type="button" class="opt" data-v="${x}" aria-pressed="${(+b.resolution || 1080) === x}">${n}</button>`).join("");
    $("#fpss").querySelectorAll(".opt").forEach(el => el.onclick = () => { b.fps = +el.dataset.v; saveBrief(); drawTiers(); });
    $("#ress").querySelectorAll(".opt").forEach(el => el.onclick = () => { b.resolution = +el.dataset.v; saveBrief(); drawTiers(); });
  };
  drawFmt(); drawTiers();

  // model set: Auto picks the full models on a 48 GB+ GPU when they're installed, else the 24 GB set
  const drawModels = () => {
    const r = S.models, cur = b.models || "auto";
    $("#mset").innerHTML = [["auto", "Auto"], ["24gb", "24 GB"], ["full", "Full"]].map(([k, n]) => `<button type="button" class="opt" data-m="${k}" aria-pressed="${cur === k}">${n}</button>`).join("");
    $("#mset").querySelectorAll(".opt").forEach(el => el.onclick = () => { b.models = el.dataset.m; saveBrief(); drawModels(); });
    if (!r){ $("#mnote").textContent = "Checking your GPU…"; return; }
    const use = cur === "auto" ? r.auto : cur, name = use === "full" ? "full models (bf16)" : "24 GB models (fp8)";
    const gpu = S.sys && S.sys.gpu ? gpuName(S.sys.gpu) + ", " : "";
    let t = r.vram_gb ? `${gpu}${Math.round(r.vram_gb)} GB${r.reserved_gb >= 1 ? ` usable (${Math.round(r.reserved_gb)} GB reserved)` : ""}: ` : "";
    t += cur === "auto" ? `Auto uses the ${name}.` : `Uses the ${name}.`;
    if (use === "full" && r.vram_gb && r.vram_gb < r.full_min_gb) t += " The full models want 48 GB or more, so this may be slow or run out of memory.";
    const miss = [...((r.missing || {})[use] || []), ...(b.engine === "h3" ? [...((r.missing_h3 || {})[use] || []),
        ...(b.preset === "pika" ? ((r.missing_pika || {})[use] || []) : []),
        ...(b.preset === "dynamic" ? ((r.missing_dynamic || {})[use] || []) : []),
        ...(b.preset === "singularity" ? ((r.missing_singularity || {})[use] || []) : [])]
      : b.preset === "max" || b.preset === "ultra" ? ((r.missing_max || {})[use] || []) : []),
      ...(b.image_model === "h3_image" ? ((r.missing_h3img || {})[use] || []) : [])];
    if (miss.length) t += ` Missing ${miss.length === 1 ? "one file" : miss.length + " files"}: ${miss.slice(0, 3).join(", ")}${miss.length > 3 ? ` and ${miss.length - 3} more` : ""}. The README lists the downloads.`;
    const packs = r.missing_packs || [];
    if (packs.length) t += ` ${packs.join(", ")} didn't load in ComfyUI (look for IMPORT FAILED in its console), so nothing can render.`;
    const checks = r.missing_checks || [];
    if (checks.length) t += ` Not installed: ${checks.join(", ")}. Runs still work, but ${checks.some(c => c.startsWith("SyncNet")) ? "lip sync isn't measured or fixed take by take" : "faces aren't tracked"}; the README lists the downloads.`;
    $("#mnote").textContent = t; $("#mnote").classList.toggle("warn", !!(miss.length || packs.length || checks.length));
    if (miss.length || packs.length || checks.length) $("details.adv").open = true;  // a warning never hides in the folded card
  };
  drawModels();
  if (S.models) drawModels();  // then fresh: files may have landed since the page opened
  api("models").then(r => { S.models = r; if ($("#mset")){ drawModels(); drawChar(); } }).catch(() => { S.models = S.models || null; });

  // advanced: a line under the card names whatever differs from the defaults
  const advNote = () => {
    const lab = id => { const el = $("#" + id); return el.options[el.selectedIndex].text; };
    const ch = [["cuts_low","Quiet parts"],["cuts_medium","Verses"],["cuts_high","Choruses"],["broll","Cutaways"],["broll_style","Cutaway style"],["looks","Looks"],
                ["framing","Framing"],["crowd","Crowd"],["cast_order","Cast order"],["qc","Retries"]]
      .filter(([k]) => String(b[k]) !== String(DEFAULT_BRIEF[k])).map(([k, n]) => `${n}: ${lab(k)}`);
    if (+b.seed !== DEFAULT_BRIEF.seed) ch.push(`Seed ${b.seed}`);
    if ((b.models || "auto") !== "auto") ch.push(`Models: ${b.models === "full" ? "Full" : "24 GB"}`);
    if (b.refine) ch.push(b.engine === "h3" || b.preset === "fast" ? "Refine details: on (LTX-2.5 Quality, Max or Ultra only)" : "Refine details: on");
    if ((b.h3_upscale || "auto") === "relayvsr") ch.push(b.engine === "h3" ? "Upscale: RelayVSR 2x" : "Upscale: RelayVSR 2x (MiniMax H3 only)");
    $("#advnote").textContent = ch.length ? "Changed: " + ch.join(" · ") : "";
  };
  for (const k of ["cuts_low","cuts_medium","cuts_high","crowd","cast_order","looks","framing","broll_style","qc"]) { const el = $("#"+k); el.value = String(b[k]); el.onchange = () => { b[k] = k === "qc" ? +el.value : el.value; saveBrief(); advNote(); }; }
  const seed = $("#seed"); seed.value = b.seed; seed.onchange = () => { b.seed = Math.max(0, parseInt(seed.value || "1", 10)); saveBrief(); advNote(); };
  const rf = $("#refine"); rf.value = b.refine ? "on" : "off";
  rf.onchange = () => { b.refine = rf.value === "on"; saveBrief(); advNote(); refreshEstimate(); };
  const hu = $("#h3up"); hu.value = b.h3_upscale || "auto";
  hu.onchange = () => { b.h3_upscale = hu.value; saveBrief(); advNote(); };
  const br = $("#broll"); br.value = String(b.broll); br.onchange = () => { b.broll = parseFloat(br.value); saveBrief(); advNote(); };
  $("#mset").addEventListener("click", advNote);
  advNote();

  // how long the preview takes (on the buttons), refreshed when the brief changes
  ta.addEventListener("input", refreshEstimate);
  for (const k of ["cuts_low","cuts_medium","cuts_high","crowd","looks","framing","qc"]) $("#"+k).addEventListener("change", refreshEstimate);
  seed.addEventListener("change", refreshEstimate); br.addEventListener("change", refreshEstimate);
  $("#tiles").addEventListener("click", refreshEstimate);
  $("#tiers").addEventListener("click", refreshEstimate);
  // song
  $("#replace").onclick = () => { b.song = ""; S.analysis = null; saveBrief(); drawSong(); };
  $("#go-preview").onclick = () => start(false);
  $("#go-render").onclick = () => start(true);
  drawSong(); drawChar();
  if (!S.sys) loadSystem().then(drawTiers);
}

// no song: make one (fv/song.py). The World line and an optional style go to Gemma for the
// lyrics, ACE-Step 1.5 sings them into the input folder, and the new song is picked.
function drawSongMaker(){
  const b = S.brief, mk = b.mk = Object.assign({style: "", len: 120, inst: false, lyrics: ""}, b.mk || {});
  const st = $("#mkstyle"), ly = $("#mklyr"), inst = $("#mkinst"), go = $("#mkgo"), note = $("#mknote");
  if (!st) return;
  st.value = mk.style; ly.value = mk.lyrics; if (mk.lyrics) $("#mklyrbox").open = true;
  st.oninput = () => { mk.style = st.value; saveBrief(); };
  ly.oninput = () => { mk.lyrics = ly.value; saveBrief(); };
  const lens = () => { $("#mklen").innerHTML = [[60,"1 min"],[120,"2 min"],[180,"3 min"]].map(([v,l]) =>
      `<button type="button" class="opt" data-v="${v}" aria-pressed="${+mk.len===v}">${l}</button>`).join("");
    $("#mklen").querySelectorAll("[data-v]").forEach(el => el.onclick = () => { mk.len = +el.dataset.v; saveBrief(); lens(); }); };
  lens();
  inst.setAttribute("aria-pressed", !!mk.inst);
  inst.onclick = () => { mk.inst = !mk.inst; inst.setAttribute("aria-pressed", mk.inst); ly.disabled = mk.inst; saveBrief(); };
  ly.disabled = !!mk.inst;
  const busy = on => { go.disabled = on; st.disabled = on; };
  const poll = async pid => {
    busy(true); const t0 = Date.now();
    for (;;){
      if (!$("#mkgo")) return;  // the song section was redrawn: the next draw picks the job up again
      let j; try{ j = await realApi("job/" + pid); }catch(e){ j = {state: "unknown"}; }
      const el = Math.round((Date.now() - t0) / 1000);
      if (j.state === "queued"){ note.textContent = `Waiting in ComfyUI's queue (${j.ahead} ahead)…`; }
      else if (j.state === "running" || j.state === "unknown"){ note.textContent = `Writing the lyrics and singing them… ${el} s`; }
      else if (j.state === "error"){ store.set("mkjob", ""); busy(false); note.textContent = "Couldn't make the song: " + j.error; return; }
      else if (j.state === "done"){
        store.set("mkjob", ""); busy(false);
        if (!j.song || !j.song.song){ note.textContent = "The song job finished without a song (see the ComfyUI console)."; return; }
        b.song = j.song.song; b.start = -1; if (!b.name) b.name = j.song.title; $("#pname").value = b.name; saveBrief();
        toast(`Made “${j.song.title}”: ${j.song.bpm} BPM, ${j.song.key}. It's in the input folder under oneshot-mv-songs.`, 7000);
        drawSong(); return;
      }
      await new Promise(r => setTimeout(r, 2500));
    }
  };
  go.onclick = async () => {
    if (DEMO){ toast("Making a song isn't simulated in demo mode."); return; }
    if (!b.theme.trim() && !mk.style.trim()){ note.textContent = "Write the World first (02 below), or give a style."; return; }
    busy(true); note.textContent = "Queueing…";
    try{
      const r = await realApi("song", {world: b.theme, style: mk.style, seconds: mk.len, instrumental: mk.inst,
                                        lyrics: mk.inst ? "" : mk.lyrics, seed: Math.floor(Math.random() * 2e9)});
      store.set("mkjob", r.prompt_id); poll(r.prompt_id);
    }catch(e){ busy(false); note.textContent = e.message; }
  };
  const pending = store.get("mkjob", "");
  if (pending) poll(pending);
  else realApi("songmaker").then(m => {
    if (!m.node) note.textContent = "Restart ComfyUI (bottom left) to load the song maker.";
    else if (m.missing.length){ go.disabled = true; note.textContent = "Needs the ACE-Step 1.5 files: " + m.missing.join(", "); }
    else note.textContent = `About ${mk.len <= 60 ? "a minute" : "1–2 minutes"}.`;
  }).catch(() => {});
}

async function drawSong(){
  const b = S.brief;
  $("#pname").placeholder = b.song ? songTitle(b.song) : "Named after the song";
  const pick = $("#songpick"), wave = $("#songwave");
  if (!b.song){
    wave.classList.add("hide"); $("#replace").classList.add("hide"); $("#playbtn").classList.add("hide");
    $("#songname").textContent = ""; $("#songmeta").textContent = "";
    pick.innerHTML = `<div class="drop" id="dropz" tabindex="0" role="button" aria-label="Upload a song">
        <svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        <div style="font-weight:700;font-size:16px">Drop a song here, or click to upload</div>
        <div class="muted" style="font-size:13px">WAV, MP3, FLAC or M4A. It goes into ComfyUI's input folder.</div>
        <input type="file" id="file" accept="audio/*,.wav,.mp3,.flac,.m4a,.ogg" class="hide">
      </div>
      <label class="field" style="margin-top:14px">Or pick one already in ComfyUI's input folder<select id="songsel"><option value="">Loading…</option></select></label>
      <div class="mksong" id="mksong">
        <div class="hd"><b>No song? Make one</b><span class="muted" style="font-size:12.5px">Lyrics and music written for your World (02 below), then sung by ACE-Step 1.5 on this machine.</span></div>
        <input type="text" id="mkstyle" maxlength="300" placeholder="Style, optional: “driving 80s synth-pop, female vocal”. Empty: picked to suit the World.">
        <div class="row" style="gap:10px;flex-wrap:wrap"><span class="seg" id="mklen"></span><button type="button" class="opt" id="mkinst" aria-pressed="false">Instrumental</button></div>
        <details id="mklyrbox"><summary>Your own lyrics (optional)</summary><textarea id="mklyr" placeholder="[Verse]&#10;…&#10;[Chorus]&#10;…&#10;Empty: written for you from the World."></textarea></details>
        <div class="row" style="gap:12px;align-items:center"><button type="button" class="btn primary" id="mkgo">Make the song</button><span id="mknote" class="muted"></span></div>
      </div>`;
    const dz = $("#dropz"), fi = $("#file");
    dz.onclick = () => fi.click();
    dz.onkeydown = e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); fi.click(); } };
    dz.ondragover = e => { e.preventDefault(); dz.classList.add("over"); };
    dz.ondragleave = () => dz.classList.remove("over");
    dz.ondrop = e => { e.preventDefault(); dz.classList.remove("over"); if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]); };
    fi.onchange = () => { if (fi.files[0]) upload(fi.files[0]); };
    drawSongMaker();
    try{
      S.songs = await api("songs");
      const sel = $("#songsel");
      if (!sel) return;
      sel.innerHTML = `<option value="">Choose a song…</option>` + S.songs.map(s => `<option value="${esc(s.name)}">${esc(s.name)}</option>`).join("");
      sel.onchange = () => { if (sel.value){ b.song = sel.value; b.start = -1; saveBrief(); drawSong(); } };
    }catch(e){ const sel = $("#songsel"); if (sel) sel.innerHTML = `<option>Couldn't list the input folder</option>`; }
    return;
  }
  pick.innerHTML = "";
  $("#songname").textContent = b.song.split("/").pop();
  $("#songmeta").textContent = "analysing…";
  $("#replace").classList.remove("hide");
  try{
    const a = S.analysis = await api(`analyze?song=${encodeURIComponent(b.song)}&seconds=${b.seconds}&start=${b.start}`);
    $("#songmeta").textContent = `${clock(a.duration)} · ${Math.round(a.tempo)} BPM${a.drop != null ? " · drop at " + clock(a.drop) : ""}`;
    drawWave(); refreshEstimate();
  }catch(e){
    $("#songmeta").textContent = "";
    pick.innerHTML = `<p class="banner" style="margin:14px 0 0">Couldn't read this song: ${esc(e.message)}</p>`;
  }
}

function drawWave(){
  const a = S.analysis, b = S.brief;
  $("#songwave").classList.remove("hide");
  const n = a.env.length, d = a.duration;
  const levelAt = t => { const s = a.sections.find(x => t >= x.start && t < x.end); return s ? s.level : "medium"; };
  const [w0, w1] = a.window, len = w1 - w0, movable = +b.seconds > 0;
  $("#bars").innerHTML = a.env.map((v,i) => `<span style="height:${Math.max(6, Math.round(10 + v * 100))}px;background:${LEVEL_COL[levelAt((i + 0.5) / n * d)]}"></span>`).join("");
  const wave = $("#wave"), win = $("#win"), wl = $("#wl"), bars = [...$("#bars").children];
  // the box at song time s: drawn live while it's dragged, then the server moves it to a bar line
  const place = s => {
    const L = s / d * 100;
    Object.assign(win.style, {left: L + "%", width: len / d * 100 + "%"});
    wl.style.left = L + "%"; wl.textContent = `${clock(s)} – ${clock(s + len)}`;
    bars.forEach((el, i) => { const t = (i + 0.5) / n * d; el.style.opacity = t >= s && t <= s + len ? 1 : .38; });
  };
  place(w0);
  win.classList.toggle("drag", movable);
  win.setAttribute("role", movable ? "slider" : "img");
  win.setAttribute("aria-label", movable ? "The part of the song in the video. Left and right arrows move it a bar, Enter plays it"
                                         : `The part of the song in the video: ${clock(w0)} to ${clock(w1)}`);
  if (movable) win.setAttribute("aria-valuetext", `${clock(w0)} to ${clock(w1)}`);
  wave.title = movable ? "Drag the box to move the part in the video. Click or drag anywhere else to listen from there; double-click to start the video there."
                       : "Click or drag to listen from there";
  const tk = []; const step = d > 240 ? 60 : 30;
  for (let t = 0; t < d - step * .4; t += step) tk.push(`<span style="left:${t/d*100}%">${clock(t)}</span>`);
  tk.push(`<span style="right:0">${clock(d)}</span>`);
  $("#ticks").innerHTML = tk.join("");
  const lens = [[15,"15 s"],[30,"30 s"],[60,"60 s"],[0,"Whole song"]], custom = !lens.some(l => +b.seconds === l[0]);
  const maxLen = Math.max(5, Math.min(600, Math.floor(d)));
  $("#lens").innerHTML = lens.map(l => `<button type="button" class="opt" data-l="${l[0]}" aria-pressed="${+b.seconds===l[0]}">${l[1]}</button>`).join("")
    + `<label class="opt optnum" aria-pressed="${custom}" title="Any length from 5 s to ${maxLen} s"><input type="number" id="lencust" min="5" max="${maxLen}" step="1" inputmode="numeric" placeholder="Custom" aria-label="Custom length in seconds" value="${custom ? Math.round(+b.seconds) : ""}"><span>s</span></label>`
    + `<button type="button" class="opt" id="auto" aria-pressed="${+b.start<0}" title="Let the Studio pick the strongest part">Auto</button>`;
  $("#lens").querySelectorAll("[data-l]").forEach(el => el.onclick = () => { b.seconds = +el.dataset.l; saveBrief(); drawSong(); viewBriefTiersRefresh(); });
  const lc = $("#lencust");
  lc.onchange = () => {
    const v = Math.round(+lc.value);
    if (!(v > 0)){ lc.value = custom ? Math.round(+b.seconds) : ""; return; }
    b.seconds = Math.max(5, Math.min(maxLen, v)); saveBrief(); drawSong(); viewBriefTiersRefresh();
  };
  lc.onkeydown = e => { if (e.key === "Enter") lc.blur(); };
  $("#auto").onclick = () => { b.start = -1; saveBrief(); drawSong(); };
  $("#winnote").textContent = (+b.start < 0 ? (movable ? "Picked for you: the strongest stretch, with the drop or chorus early on. Drag the box to start somewhere else." : "The whole song.")
    : `Starts at ${clock(w0)} (moved to the nearest bar line). Auto lets the Studio pick.`) + " Click or drag the waveform to listen from anywhere.";
  // listening: "Play this part" plays the box and stops at its end; a click or drag anywhere else
  // plays the song from there (scrubbing). S.analysis, not this draw's window: a drag redraws.
  const au = $("#audio"), pb = $("#playbtn"), ph = $("#ph");
  pb.classList.remove("hide");
  if (au.dataset.src !== a.url){ au.src = a.url; au.dataset.src = a.url; S.playSel = false; }
  pb.textContent = au.paused ? "Play this part" : "Stop";
  const play = () => au.play().catch(() => toast("The browser couldn't play this file."));
  const showPh = t => { ph.style.display = "block"; ph.style.left = (t / d * 100) + "%"; ph.dataset.t = clock(t); };
  const playPart = () => { S.playSel = true; au.currentTime = S.analysis.window[0]; showPh(au.currentTime); play(); };
  const listen = t => { S.playSel = false; au.currentTime = t; showPh(t); if (au.paused) play(); };
  const tick = () => {
    if (S.playSel && au.currentTime >= S.analysis.window[1]) au.pause();
    showPh(au.currentTime);
    if (!au.paused) requestAnimationFrame(tick);
  };
  pb.onclick = () => au.paused ? playPart() : au.pause();
  au.onplay = () => { pb.textContent = "Stop"; requestAnimationFrame(tick); };
  au.onpause = () => { pb.textContent = "Play this part"; };
  au.ontimeupdate = null;
  if (!au.paused || au.currentTime > 0) showPh(au.currentTime);
  const moveTo = s => {  // a new start for the box; keeps playing the part if it was
    const again = !au.paused && S.playSel;
    b.start = Math.round(Math.min(Math.max(s, 0), d - len) * 100) / 100; saveBrief();
    drawSong().then(() => { if (again) playPart(); });
  };
  const at = e => { const r = wave.getBoundingClientRect(); return Math.min(Math.max((e.clientX - r.left) / r.width, 0), 1) * d; };
  wave.onpointerdown = e => {
    if (e.button !== 0) return;
    e.preventDefault(); wave.setPointerCapture(e.pointerId);
    const onWin = movable && win.contains(e.target), t0 = at(e);
    let s = w0, moved = false;
    if (onWin){ wave.classList.add("dragging"); win.focus({preventScroll: true}); } else listen(t0);
    wave.onpointermove = m => {
      if (!onWin){ listen(at(m)); return; }
      s = Math.min(Math.max(w0 + at(m) - t0, 0), d - len);
      moved = moved || Math.abs(at(m) - t0) > d / 500;
      place(s);
    };
    wave.onpointerup = wave.onpointercancel = () => {
      wave.onpointermove = wave.onpointerup = wave.onpointercancel = null;
      wave.classList.remove("dragging");
      if (moved) moveTo(s);
    };
  };
  wave.ondblclick = e => { if (movable && !win.contains(e.target)) moveTo(at(e)); };
  win.onkeydown = e => {
    if (e.key === "Enter" || e.key === " "){ e.preventDefault(); au.paused ? playPart() : au.pause(); return; }
    if (!movable || (e.key !== "ArrowLeft" && e.key !== "ArrowRight")) return;
    e.preventDefault();
    const bar = 4 * 60 / (a.tempo || 120) * (e.shiftKey ? 4 : 1);
    moveTo(w0 + (e.key === "ArrowRight" ? bar : -bar));
  };
}
function viewBriefTiersRefresh(){ const b = S.brief; const tiers = $("#tiers"); if (!tiers) return;
  tiers.querySelectorAll(".tier").forEach(el => { const e = estimate(Object.assign({}, b, {preset: el.dataset.q})); el.querySelector(".eta").textContent = "≈ " + mins(e); });
  const sec = +b.seconds > 0 ? b.seconds + " s" : "the whole song"; const n = $("#etanote"); if (n) n.textContent = `Times are a rough guide for ${sec}${S.sys && S.sys.gpu ? " on " + gpuName(S.sys.gpu) : ""}.`; }

let _estT = null, _estN = 0;
function refreshEstimate(){
  clearTimeout(_estT);
  _estT = setTimeout(async () => {
    const b = S.brief, ep = $("#eta-prev"), ea = $("#eta-all"), why = $("#eta-why");
    if (!ep) return;
    if (!b.song){ ep.textContent = ""; ea.textContent = ""; why.textContent = "See the World the tool writes and every shot before the long render."; return; }
    const n = ++_estN;
    const qs = ["song","seconds","start","theme","seed","broll","format","preset","cuts_low","cuts_medium","cuts_high","crowd"].map(k => k + "=" + encodeURIComponent(b[k] ?? "")).join("&");
    try{
      const e = await api("estimate?" + qs);
      if (n !== _estN) return;
      S.est = e;
      ep.textContent = "about " + dur(e.total_s);
      ea.textContent = "about " + mins(e.total_s / 60 + e.render_min) + " in all";
      const chars = e.parts.find(x => x.id === "cast");
      why.textContent = !b.theme.trim() ? `About ${dur(e.total_s)}: the song is analysed and the shots planned in the house look.`
        : e.world_cached ? `About ${dur(e.total_s)}: this World is already written for this line and seed, so only the song is analysed.`
        : `About ${dur(e.total_s)}: Gemma writes the World and a character for each of the ${e.shots} shots${chars ? ", 8 at a time" : ""}. A second preview with the same line and seed is quick.`;
    }catch(err){ if (n === _estN){ ep.textContent = ""; ea.textContent = ""; } }
  }, 500);
}

// a file into ComfyUI's input folder; its name there
async function toInput(file, what){
  overlay("Uploading the " + what, file.name);
  try{
    const fd = new FormData(); fd.append("image", file, file.name); fd.append("type", "input"); fd.append("overwrite", "false");
    const r = await fetch("/api/upload/image", {method:"POST", body:fd});
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    overlay(); return (j.subfolder ? j.subfolder + "/" : "") + j.name;
  }catch(e){ overlay(); toast("Upload failed: " + e.message); return ""; }
}
async function upload(file){
  const name = await toInput(file, "song");
  if (name){ S.brief.song = name; S.brief.start = -1; saveBrief(); drawSong(); }
}

// the character photos: every singer becomes one of these people, in the World's outfits,
// places and light; the singers take the photos in turn (the Director's one-artist mode)
const MAX_CHARS = 8;
function drawChar(){
  const b = S.brief, pick = $("#charpick");
  if (!pick) return;
  const cs = b.characters || (b.characters = []);
  const miss = (S.models && S.models.missing_character) || [];
  const note = $("#charnote");
  note.textContent = miss.length ? `A character run needs ${miss.length === 1 ? "one more file" : miss.length + " more files"}: ${miss.slice(0, 3).join(", ")}${miss.length > 3 ? ` and ${miss.length - 3} more` : ""}. The README lists the downloads.`
    : cs.length > 1 ? `The singers take turns: shot 1 is A, shot 2 is B and so on, and each shot's quick looks stay that person. Use photos of people who agreed to this.`
    : cs.length ? "Every singer in the video is this person, dressed and placed by the World line. Add more photos to cast several people. Use photos of people who agreed to this."
    : "Add photos of one person each, and every singer in the video becomes one of them. Without any, every face is invented.";
  note.classList.toggle("warn", !!miss.length);
  const add = async files => {
    for (const f of [...files].slice(0, MAX_CHARS - cs.length)){ const name = await toInput(f, "photo"); if (name) cs.push(name); }
    saveBrief(); drawChar(); };
  const view = c => { const parts = c.split("/"); return "/api/view?" + new URLSearchParams({filename: parts.pop(), subfolder: parts.join("/"), type: "input"}); };
  if (cs.length){
    pick.innerHTML = `<div class="chars">${cs.map((c, i) => `<figure class="charcard"><img src="${view(c)}" alt="Character ${String.fromCharCode(65 + i)}">
        <figcaption><b>${String.fromCharCode(65 + i)}</b><span>${esc(c.split("/").pop())}</span></figcaption>
        <button type="button" class="btn sm ghost" data-rm="${i}" aria-label="Remove character ${String.fromCharCode(65 + i)}">✕</button></figure>`).join("")}
      ${cs.length < MAX_CHARS ? `<button type="button" class="charadd" id="chardrop" aria-label="Add a character photo"><span aria-hidden="true">+</span>Add a photo</button>` : ""}</div>`;
    pick.querySelectorAll("[data-rm]").forEach(el => el.onclick = () => { cs.splice(+el.dataset.rm, 1); saveBrief(); drawChar(); });
  } else {
    pick.innerHTML = `<div class="drop" id="chardrop" tabindex="0" role="button" aria-label="Upload character photos">
        <div style="font-weight:700;font-size:16px">Drop photos here, or click to upload</div>
        <div class="muted" style="font-size:13px">One person per photo, face clearly visible. Up to ${MAX_CHARS}. JPG, PNG or WebP.</div>
      </div>`;
  }
  let fi = $("#charfile");
  if (!fi){ fi = document.createElement("input"); Object.assign(fi, {type: "file", id: "charfile", accept: "image/*", multiple: true, className: "hide"}); document.body.append(fi); }
  fi.onchange = () => { add(fi.files); fi.value = ""; };
  const dz = $("#chardrop");
  if (dz){
    dz.onclick = () => fi.click();
    dz.onkeydown = e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); fi.click(); } };
    dz.ondragover = e => { e.preventDefault(); dz.classList.add("over"); };
    dz.ondragleave = () => dz.classList.remove("over");
    dz.ondrop = e => { e.preventDefault(); dz.classList.remove("over"); add(e.dataTransfer.files); };
  }
  const fine = $("#finep"); if (fine) fine.textContent = cs.length ? "Use music and photos you have the rights to." : "Use music you have the rights to. Every face is invented.";
}

async function start(render, briefOverride){
  const b = Object.assign({}, briefOverride || S.brief);
  if (!b.song){ toast("Pick a song first."); return; }
  b.name = String(b.name || "").trim() || songTitle(b.song);
  b.render = !!render;
  try{
    overlay(render ? "Starting the video" : "Writing the plan", render ? "Analysing the song, writing the World and queueing every shot. This takes a minute or two." : "Analysing the song, writing the World and planning every shot. Nothing renders yet.");
    const {prompt_id} = await api("start", b);
    const brief = Object.assign({}, b); delete brief.render;
    const t0 = Date.now();
    for (;;){
      await new Promise(r => setTimeout(r, 2000));
      const j = await api("job/" + prompt_id);
      const el = Math.round((Date.now() - t0) / 1000);
      if (j.state === "queued") $("#ovs").textContent = `Waiting in ComfyUI's queue (${j.ahead} ahead) · ${el} s`;
      else if (j.state === "running"){
        $("#ovs").textContent = j.step ? j.step + "…" : (render ? "Analysing the song, writing the World and queueing every shot" : "Analysing the song, writing the World and planning every shot");
        if (j.elapsed_s != null && j.left_s != null) overlayProgress(j.elapsed_s, j.left_s);
      }
      else if (j.state === "error") throw new Error(j.error);
      else if (j.state === "done"){
        if (!j.run) throw new Error("the Director finished without a run folder");
        const briefs = store.get("briefs", {}); briefs[j.run] = brief; store.set("briefs", briefs);
        S.editing = null; store.set("editing", null);
        overlay(); location.hash = "#/run/" + encodeURIComponent(j.run); return;
      }
    }
  }catch(e){ overlay(); toast("It didn't start: " + e.message, 20000); }
}

// ---------------------------------------------------------------- 2. A video
// One workspace from the plan to the last re-shoot. The song runs along the bottom with every
// shot on it; the viewer plays the cut, or before there is one the song over each shot's clip,
// still or plan; the panel on the right is the picked shot, the video, and its finishing.
const pickKey = run => "pickups." + run;
let REFINE_OPEN = null;  // the open Finish panel (all closed at first)
const CAST_C = ["#ff7a2f", "#5b9bff", "#3fbf7f", "#c77dff", "#f0b13d", "#ef5047", "#4fd1c5", "#f78fb3"];
const FLAGS = {sync: "Weak lip sync: the mouth doesn't follow the vocal", cut: "Cuts away inside the clip", drift: "Drifts off the planned shot",
  frozen: "Frozen or barely moving", face: "The face is lost", bars: "Black bars in the frame", exposure: "Badly exposed", missing: "The clip is missing"};
const PLAY = `<svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5v11l9-5.5z"/></svg>`;
const PAUSE = `<svg viewBox="0 0 16 16" fill="currentColor"><path d="M3.5 2.5h3v11h-3zM9.5 2.5h3v11h-3z"/></svg>`;
const EDIT_ICON = `<svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M11 2.5l2.5 2.5L6 12.5H3.5V10z"/></svg>`;
const inputView = f => { const p = String(f).split("/"); return "/api/view?" + new URLSearchParams({filename: p.pop(), subfolder: p.join("/"), type: "input"}); };
const tc = t => { t = Math.max(0, t); const m = Math.floor(t / 60); return m + ":" + (t - m * 60).toFixed(1).padStart(4, "0"); };
const flagged = s => !!(s.qc && s.qc.fail.length);
const pkId = x => x.n + ":" + (x.render ?? "");
// where a run is: its plan, rendering, or a cut to watch (re-shoots happen on a cut)
const phaseOf = r => r.stage === "preview" ? "plan" : (r.video ? "cut" : "render");

async function viewRun(run){

  W.F0 = Object.assign({fx: Object.assign({}, fx0)}, r.finish || {});
  W.E = Object.assign({}, W.F0, {fx: Object.assign({}, fx0)});

      <p class="sub">${esc(r.world.headline || "House look")} · <span class="mono">${esc(r.brief.from)} – ${esc(r.brief.to)}</span> · ${esc(r.brief.format)} · ${esc(presetName(r.brief.preset))} · ${r.shots.length} shots</p></div>
    <div class="acts" id="wacts"></div><div class="wprog hide" id="wprog"></div></div>
  <div class="wmid">
    <section class="viewer" aria-label="Viewer"><div class="screen" id="screen"></div>
      <div class="transport">
        <button class="ibtn" id="tprev" type="button" title="Previous shot (←)" aria-label="Previous shot"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M3 3h2v10H3zM14 3v10L6 8z"/></svg></button>
        <button class="ibtn big" id="tplay" type="button" title="Play (Space)" aria-label="Play"></button>
        <button class="ibtn" id="tnext" type="button" title="Next shot (→)" aria-label="Next shot"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M11 3h2v10h-2zM2 3v10l8-5z"/></svg></button>
        <span class="clock" id="tclock"></span><span class="grow"></span>

        <div class="seg mini" role="group" aria-label="Versions" id="vers"></div>

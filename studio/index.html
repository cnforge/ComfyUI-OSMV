function wsStatus(r){
  const ph = phaseOf(r);
  if (ph === "plan") return "Plan, nothing rendered";
  if (ph === "render") return r.stalled ? "Stopped" : `Rendering · ${r.pct}%`;
  return r.pickup && r.pickup.state === "running" ? (r.pickup.kind === "sharpen" ? "Re-decoding" : "Re-shooting") : "Done";
}

// ---- the clock: the cut when there is one, otherwise the song (song.wav is the whole song)
function wsMedia(){
  const W = S.ws, r = W.r, scr = $("#screen");
  if (r.video){
    scr.innerHTML = `<video id="wv" src="${esc(W.vers[W.curV].url)}" playsinline preload="auto"></video><span class="stag" id="vtag"></span>`;
    const v = W.media = $("#wv"), off = 0;
    W.now = () => v.currentTime - off; W.seek = t => { v.currentTime = Math.max(0, t); };
  } else {
    scr.innerHTML = `<div class="frame" id="frame"></div><span class="stag" id="vtag"></span>${r.song ? `<audio id="wa" src="${esc(r.song)}" preload="auto"></audio>` : ""}`;
    const a = W.media = $("#wa"), off = +r.brief.t0 || 0;
    W.now = () => a ? a.currentTime - off : 0; W.seek = t => { if (a) a.currentTime = off + Math.max(0, t); };
    W.frameN = null;
    $("#frame").onclick = wsToggle;
  }
  if (W.media && W.media.tagName === "VIDEO"){
    W.media.onclick = wsToggle;
    W.media.addEventListener("loadedmetadata", wsScale);
    wsScale();
  }
  $("#tplay").disabled = !W.media;
}
// the viewer's size: Fit (fills the viewer) or a share of the cut's own pixels
const VSCALES = [["fit", "Fit"], ["0.25", "25%"], ["0.5", "50%"], ["0.75", "75%"], ["1", "100%"], ["2", "200%"]];
function wsScale(){
  const v = $("#wv"), scr = $("#screen");
  if (!v || !scr) return;
  const k = String(store.get("vscale", "fit"));
  const fit = k === "fit" || !(+k > 0);
  if (v.videoWidth && v.videoHeight) scr.style.setProperty("--var", v.videoWidth / v.videoHeight);
  v.classList.toggle("fit", fit);
  scr.classList.toggle("scaled", !fit);
  v.style.width = fit || !v.videoWidth ? "" : Math.round(v.videoWidth * +k) + "px";
}
const wsToggle = () => { const m = S.ws && S.ws.media; if (!m) return; if (m.paused){ if (S.ws.now() >= S.ws.D - .05) S.ws.seek(0); m.play(); } else m.pause(); };
// the shot under the playhead, in the viewer when there is no cut to play
function wsFrame(s){
  const W = S.ws, f = $("#frame");
  if (!f || W.frameN === s.n + ":" + s.state) return;
  W.frameN = s.n + ":" + s.state;
  f.innerHTML = s.state === "clip" && s.clip ? `<video src="${esc(s.clip)}" muted loop autoplay playsinline></video>` : s.still ? `<img src="${esc(s.still)}" alt="">`
    : `<div class="plan"><span class="mono tiny">Shot ${s.n} · ${s.kind === "broll" ? "cutaway" : esc(s.size)} · ${esc(PARTS[s.part] || s.part || s.energy)}</span><b>${esc(s.role || "?")}</b>
       <span>${esc([s.wear, s.place].filter(Boolean).join(" · ").slice(0, 220))}</span></div>`;
}
function wsTick(W){
  if (S.ws !== W || !document.body.contains($("#tph"))) return;
  const t = Math.min(W.D, W.now()), x = t * wsPps();
  $("#tph").style.left = x + "px";
  $("#tclock").innerHTML = `<b>${tc(t)}</b> / ${tc(W.D)}`;
  const playing = W.media && !W.media.paused;
  if ($("#tplay").dataset.p !== String(playing)){ $("#tplay").dataset.p = playing; $("#tplay").innerHTML = playing ? PAUSE : PLAY; $("#tplay").setAttribute("aria-label", playing ? "Pause" : "Play"); }
  if (playing && W.media.tagName === "AUDIO" && t >= W.D) W.media.pause();
  const s = wsShotAt(t);
  if (s){
    $("#vtag").textContent = `Shot ${s.n} · ${s.kind === "broll" ? "cutaway" : "sung"}${s.part ? " · " + (PARTS[s.part] || s.part) : ""}`;
    if (W.nowN !== s.n){ W.nowN = s.n; document.querySelectorAll(".tshot").forEach(e => e.classList.toggle("now", +e.dataset.n === s.n)); }
    wsFrame(s);
    if (playing && s.n !== W.sel + 1){ W.sel = s.n - 1; W.take = null; wsMarks(); if (W.tab === "shot") wsPanel(); wsDrawWave(); }
  }
  const sc = $("#tscroll");
  if (playing && W.follow && (x > sc.scrollLeft + sc.clientWidth * .85 || x < sc.scrollLeft)) sc.scrollLeft = x - sc.clientWidth * .2;
  requestAnimationFrame(() => wsTick(W));
}
const wsShotAt = t => { const sh = S.ws.r.shots; return sh.find(s => t >= s.t0 && t < s.t1) || sh[sh.length - 1]; };

// ---- the head: status, progress and the actions for where the video is

      if (!confirm("Stop this video? Its queued shots are removed and the one rendering stops.")) return;
      try{ const j = await api("cancel", {run: r.run}); toast(`Stopped: ${j.removed} queued job${j.removed === 1 ? "" : "s"} removed.`); }catch(e){ toast(e.message); }
    };
    const now = r.stages.find(s => s.state === "now");

    prog.innerHTML = r.stalled
      ? `<span>Nothing of this video is left in ComfyUI's queue, but it isn't finished. A step probably failed: the ComfyUI console shows why. You can <a href="#/edit/${encodeURIComponent(r.run)}">edit its brief and resubmit it</a>.</span>`
      : `<span>${esc((now ? now.name + " · " + now.meta : "Starting") + nowLine(r))}</span><div class="progress" role="progressbar" aria-label="Overall progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${r.pct}"><div style="width:${r.pct}%"></div></div>
         <span>${r.pct}% · ${mins(r.elapsed_min)} in · ${r.left_min > 0 ? "about " + mins(r.left_min) + " to go" : "nearly there"}</span>`;
  } else {
    const v = W.vers[W.curV] || {};
    acts.innerHTML = edit + `<a class="btn" href="/oneshot-mv/api/xml/${encodeURIComponent(r.run)}" download="${esc(fileStem(r))}.xml" title="Final Cut Pro 7 XML: every shot's clip with its in and out points and the song, for Premiere Pro and DaVinci Resolve">Export XML</a>
      <a class="btn" id="dl" href="${esc(v.url)}" download="${esc(fileStem(r) + (v.tall ? "_9x16" : ""))}.mp4"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 2v9M4 7l4 4 4-4M3 14h10"/></svg>Download</a>
      <button class="btn${W.pk.length && !shooting ? " primary" : ""}" id="shoot" type="button" ${W.pk.length && !shooting ? "" : "disabled"}>${shooting ? "Re-shooting…" : W.pk.length ? `Re-shoot ${W.pk.length} <span class="eta-b">≈ ${mins(wsPkMin())}</span>` : "Re-shoot"}</button>`;
    $("#shoot").onclick = wsShoot;
    if (shooting){
      const done = Math.max(0, pk.jobs - pk.jobs_left), pct = Math.round(100 * done / Math.max(1, pk.jobs));
      prog.className = "wprog";
      prog.innerHTML = `<span>${pk.kind === "sharpen" ? `Re-decoding ${pk.items.length} clips` : `Re-shooting ${pk.items.map(x => "shot " + x.shot).join(", ")}`}</span><div class="progress"><div style="width:${pct}%"></div></div>
        <span>${done} of ${pk.jobs} jobs · about ${mins(pk.left_min)} left · the cut below is kept as a version</span>`;
    } else if (pk.state === "stopped"){
      prog.className = "wprog stall";
      prog.innerHTML = `<span>The last ${pk.kind === "sharpen" ? "re-decode" : "re-shoot"} stopped before the new cut was made; the ComfyUI console shows why. This is the cut before.</span>`;
    }
  }
}
function wsVers(){
  const W = S.ws, box = $("#vers");

function wsPanelBind(body){
  const W = S.ws, r = W.r, s = r.shots[W.sel];

  const ta = $("#pnote");
  if (ta) ta.oninput = () => {
    const id = pkId({n: s.n, render: W.take}), cur = W.pk.find(x => pkId(x) === id);
    if (cur) cur.note = ta.value.trim(); else if (ta.value.trim()){ wsQueue("take", ta.value.trim()); return; }

    q.onclick = go; q.onkeydown = e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); go(e); } };
  });

}
// a shot's re-shoot: pressing its mode again takes it back out
function wsMode(m){
  const W = S.ws, s = W.r.shots[W.sel];
  if ((W.r.pickup || {}).state === "running") return;
  const id = pkId({n: s.n, render: W.take}), cur = W.pk.find(x => pkId(x) === id);
  if (cur && cur.mode === m){ W.pk = W.pk.filter(x => x !== cur); wsSavePk(); return; }
  if (cur){ cur.mode = m; wsSavePk(); return; }
  wsQueue(m, ($("#pnote") || {}).value || "");
}
function wsQueue(mode, note){
  const W = S.ws, s = W.r.shots[W.sel], looks = s.looks || [], li = looks.findIndex(l => l.render === W.take);
  W.pk.push({n: s.n, render: W.take, look: li < 0 ? "" : `look ${li + 1}`, mode, note: note.trim(), still: li < 0 ? s.still : looks[li].still, role: s.role, t: clock(s.t0)});
  W.pk.sort((a, b) => a.n - b.n || (a.render ?? -1) - (b.render ?? -1));
  wsSavePk();
}
function wsSavePk(redraw = true){
  const W = S.ws;
  store.set(pickKey(W.run), W.pk);
  wsHead(); wsMarks();
  if (redraw){ const ta = $("#pnote"), focus = ta && document.activeElement === ta, pos = ta ? ta.selectionStart : 0; wsPanel(); if (focus && $("#pnote")){ $("#pnote").focus(); $("#pnote").setSelectionRange(pos, pos); } }
}
// as fv/studio.py _pickups works it out
function wsPkMin(){ const W = S.ws, nr = W.pk.filter(x => x.mode === "recast").length; return (nr ? 3 + 0.5 * nr : 0) + 2 + 1.2 * W.pk.length + 1 + 0.035 * W.D; }
async function wsShoot(){
  const W = S.ws;
  if (!W.pk.length) return;
  try{
    overlay("Queueing the re-shoots", `${W.pk.length} take${W.pk.length > 1 ? "s" : ""}, then a new cut.`);
    await api("pickups", {run: W.run, items: W.pk.map(x => ({n: x.n, render: x.render ?? null, mode: x.mode, note: x.note}))});
    store.set(pickKey(W.run), []); overlay(); stopTimer(); viewRun(W.run);
  }catch(e){ overlay(); toast("The re-shoots didn't start: " + e.message, 9000); }
}

  seg("fmusic", "music", false, drawMusic);
  const lc = $("#flencust"); if (![15,30,60,90].includes(+f.seconds)) lc.value = f.seconds;
  lc.onchange = () => { const v = Math.round(+lc.value); if (v >= 5){ f.seconds = Math.min(300, v); save(); $("#flen").querySelectorAll(".opt").forEach(o => o.setAttribute("aria-pressed", "false")); } };
  h3(); const hu = $("#fh3up"); hu.value = f.h3_upscale; hu.onchange = () => { f.h3_upscale = hu.value; save(); };
  const sd = $("#fseed"); sd.value = f.seed; sd.onchange = () => { f.seed = Math.max(0, parseInt(sd.value || "1", 10)); save(); };
  $("#freset").onclick = () => { if (!confirm("Start over? The film brief goes back to its defaults.")) return; store.set("filmbrief", {}); viewFilmBrief(); };
  try{ const looks = await api("looks"); const sel = $("#flook"); sel.innerHTML = looks.map(([k, n]) => `<option value="${esc(k)}">${esc(n)}</option>`).join(""); sel.value = f.look; sel.onchange = () => { f.look = sel.value; save(); }; }catch(e){}
  async function drawMusic(){
    const box = $("#fmusicbox"); if (!box) return;
    if (f.music === "sound"){ box.innerHTML = `<p class="tiny" style="margin:0">Each shot keeps the sound the video model made with it (LTX-2.5 and H3 make sound with the picture).</p>`; return; }
    if (f.music === "none"){ box.innerHTML = `<p class="tiny" style="margin:0">No sound at all: add your own in the edit.</p>`; return; }
    if (f.music === "song"){
      box.innerHTML = `<label class="field">The music, cut on its beats (the strongest stretch of it)<select id="fsong"><option value="">Loading…</option></select></label>`;
      try{ const songs = await api("songs"); const sel = $("#fsong"); if (!sel) return;
        sel.innerHTML = `<option value="">Choose a song…</option>` + songs.map(x => `<option value="${esc(x.name)}">${esc(x.name)}</option>`).join("");
        sel.value = f.song; sel.onchange = () => { f.song = sel.value; save(); }; }catch(e){}
      return;
    }
    box.innerHTML = `<div class="mksong" style="margin-top:0"><div class="hd"><b>Music for this film</b><span class="muted" style="font-size:12.5px">Written from the script and played by ACE-Step 1.5, then cut to.</span></div>
      <input type="text" id="fmkstyle" maxlength="300" placeholder="Style, optional: “warm acoustic folk, gentle guitar”. Empty: picked to suit the script.">
      <div class="row" style="gap:10px"><button type="button" class="opt" id="fmkinst" aria-pressed="${!!f.mkinst}">Instrumental</button><button type="button" class="btn primary" id="fmkgo">Make the music</button><span id="fmknote" class="muted" style="font-size:12.5px">${f.song && f.song.startsWith("oneshot-mv-songs/") ? "Made: " + esc(f.song.split("/").pop()) : ""}</span></div></div>`;
    const st = $("#fmkstyle"); st.value = f.mkstyle; st.oninput = () => { f.mkstyle = st.value; save(); };
    const ins = $("#fmkinst"); ins.onclick = () => { f.mkinst = !f.mkinst; ins.setAttribute("aria-pressed", f.mkinst); save(); };
    $("#fmkgo").onclick = async () => {
      if (!f.script.trim()){ $("#fmknote").textContent = "Write the script first."; return; }
      const go = $("#fmkgo"), note = $("#fmknote"); go.disabled = true; note.textContent = "Queueing…";
      try{
        const r = await realApi("song", {world: f.script, style: f.mkstyle, seconds: Math.min(300, Math.max(30, Math.ceil(+f.seconds / 30) * 30 + 15)),
                                         instrumental: !!f.mkinst, seed: Math.floor(Math.random() * 2e9)});
        const t0 = Date.now();
        for (;;){
          await new Promise(res => setTimeout(res, 2500));
          if (!$("#fmknote")) return;
          const j = await realApi("job/" + r.prompt_id);
          if (j.state === "error"){ note.textContent = "Couldn't make the music: " + j.error; break; }
          if (j.state === "done"){ f.song = j.song.song; save(); note.textContent = `Made “${j.song.title}”, ${j.song.bpm} BPM.`; break; }
          note.textContent = j.state === "queued" ? `Waiting in ComfyUI's queue (${j.ahead} ahead)…` : `Writing and playing it… ${Math.round((Date.now() - t0) / 1000)} s`;
        }
      }catch(e){ note.textContent = e.message; }
      go.disabled = false;
    };
  }
  drawMusic();
  $("#fgo").onclick = async () => {
    if (DEMO) return toast("Film mode isn't simulated in demo mode.");
    if (f.script.trim().length < 8) return toast("Write the script or idea first.");
    const song = f.music === "song" || f.music === "make" ? f.song : "";
    if ((f.music === "song" || f.music === "make") && !song) return toast(f.music === "song" ? "Pick a song, or choose another sound." : "Make the music first, or choose another sound.");
    overlay("Writing the film", "Gemma is writing the cast, the look and every shot, then each shot is queued. About a minute.");
    try{
      const r = await realApi("film", {name: f.name, kind: f.kind, script: f.script, style: f.style, seconds: f.seconds, format: f.format,
        preset: f.preset, h3_upscale: f.h3_upscale, resolution: f.resolution, look: f.look, song, song_start: -1,
        sound: f.music !== "none", seed: f.seed, shots: f.shots || "cuts", draft: !!f.draft});
      for (;;){
        await new Promise(res => setTimeout(res, 2000));
        const j = await realApi("job/" + r.prompt_id);
        if (j.state === "error"){ overlay(); return toast("Couldn't plan the film: " + j.error, 9000); }
        if (j.state === "done"){ overlay(); location.hash = "#/film/" + encodeURIComponent(j.film); return; }
        const ovs = $("#ovs"); if (ovs && j.state === "queued") ovs.textContent = `Waiting in ComfyUI's queue (${j.ahead} ahead)…`;
      }
    }catch(e){ overlay(); toast(e.message, 8000); }
  };
}

async function viewFilm(run){
  setSteps(-1);
  const app = $("#app");
  app.innerHTML = `<p class="muted">Loading…</p>`;
  let f;
  try{ f = await realApi("film/" + encodeURIComponent(run)); }catch(e){ toast(e.message); location.hash = "#/videos"; return; }
  const done = f.shots.filter(s => s.state === "done").length, n = f.shots.length;
  const model = (FILM_MODELS.find(m => m[0] === f.preset) || [0, f.preset])[1];
  const stLabel = {done: ["ok","Done"], rendering: ["run","Rendering"], cutting: ["run","Cutting"], stopped: ["pre","Stopped"]}[f.state] || ["pre", f.state];
  app.innerHTML = `
  <div class="head"><div><p class="proj">${esc((FILM_KINDS.find(k => k[0] === f.kind) || [0, "Film"])[1])}</p><h1>${esc(f.title || run)}</h1>
    <p class="sub">${Math.round(f.seconds)} s · ${esc(f.format)} · ${esc(model)}${f.h3_vsr ? " · RelayVSR" : ""} · ${f.one_shot ? "one shot, no cuts" : n + " shots"}${f.song ? " · music: " + esc(f.song) : ""} · <span class="badge ${stLabel[0]}">${stLabel[1]}</span></p>${f.note ? `<p class="tiny muted" style="margin:4px 0 0">${esc(f.note.replace(/^one shot: /, "One shot: "))}.</p>` : ""}</div>
    <div class="row" style="gap:8px">${f.state === "rendering" || f.state === "cutting" ? `<button class="btn danger sm" id="fcancel" type="button">Stop</button>` : ""}${f.video ? `<a class="btn sm" href="${esc(f.video)}" download>Download</a>` : ""}<a class="btn primary sm" href="#/film">New film</a></div></div>
  <div class="fplayer">${f.video ? `<video src="${esc(f.video)}" controls playsinline preload="metadata"></video>`
    : `<div class="ph">${f.state === "rendering" ? `Rendering: ${done} of ${n} shots done${f.cut_queued ? ", then the cut" : ""}.<br>The film plays here once it's cut.` : f.state === "cutting" ? "Cutting the film…" : "Not cut yet."}</div>`}</div>
  <div class="row" style="margin:14px 0 22px;gap:10px;align-items:flex-end">
    <label class="field" style="min-width:220px">Grade<select id="vlook">${f.looks.map(([k, nm]) => `<option value="${esc(k)}">${esc(nm)}</option>`).join("")}</select></label>
    <button class="btn" id="vrecut" type="button" ${done ? "" : "disabled"}>Re-cut</button>
    <span class="tiny muted">A re-cut uses every shot's newest take and the grade: nothing re-renders.</span></div>
  <h2 class="label" style="margin-bottom:12px">Shots</h2>
  <div class="fshots">${f.shots.map(s => `<div class="fshot"><div class="th" style="aspect-ratio:${f.format.replace(":", "/")}">${s.clip ? `<video src="${esc(s.clip)}" muted loop playsinline preload="metadata" onmouseenter="this.play()" onmouseleave="this.pause()"></video>` : esc(s.state === "rendering" ? "Rendering…" : s.state === "queued" ? "Queued" : "Not rendered")}</div>
    <div class="bd"><div class="row" style="justify-content:space-between;gap:6px"><b>Shot ${s.i + 1}</b><span class="mono tiny">${clock(s.t0)}–${clock(s.t1)} · ${(s.t1 - s.t0).toFixed(1)} s${s.takes > 1 ? " · take " + s.takes : ""}</span></div>
      <p>${esc(s.video)}</p>${s.cast.length ? `<div>${s.cast.map(c => `<span class="chip">${esc(c)}</span>`).join("")}</div>` : ""}
      <div><button class="btn sm" data-reshoot="${s.i}" type="button" ${s.state === "queued" || s.state === "rendering" ? "disabled" : ""}>Re-shoot</button></div></div></div>`).join("")}</div>
  <div class="card" style="margin-top:22px"><h2 class="label">The film's bible</h2>
    ${f.look ? `<p style="margin:12px 0 0"><b>Look.</b> <span class="muted">${esc(f.look)}</span></p>` : ""}
    ${f.cast.length ? `<div style="margin-top:10px">${f.cast.map(c => `<p style="margin:6px 0"><b>${esc(c.name)}.</b> <span class="muted">${esc(c.look)}</span></p>`).join("")}</div>` : ""}
    <details style="margin-top:12px"><summary class="muted" style="cursor:pointer">The script</summary><p style="white-space:pre-wrap;margin:10px 0 0">${esc(f.script || "")}</p></details></div>`;
  const vl = $("#vlook"); vl.value = f.look_grade || "none";
  $("#vrecut").onclick = async () => { try{ await realApi("film/recut", {run, look: vl.value}); toast("Re-cut queued."); viewFilm(run); }catch(e){ toast(e.message); } };
  app.querySelectorAll("[data-reshoot]").forEach(b => b.onclick = async () => {
    try{ await realApi("film/reshoot", {run, shots: [+b.dataset.reshoot]}); toast(`Shot ${+b.dataset.reshoot + 1} re-queued, then a new cut.`); viewFilm(run); }catch(e){ toast(e.message); } });
  const cx = $("#fcancel"); if (cx) cx.onclick = async () => { if (!confirm("Stop this film? Rendered shots are kept; the rest are dropped from the queue.")) return;
    try{ await realApi("film/cancel", {run}); viewFilm(run); }catch(e){ toast(e.message); } };
  if (f.state === "rendering" || f.state === "cutting"){
    S.timer = setTimeout(() => { if (location.hash === "#/film/" + encodeURIComponent(run) && !(app.querySelector("video") && !app.querySelector("video").paused)) viewFilm(run); else if (location.hash === "#/film/" + encodeURIComponent(run)) S.timer = setTimeout(() => viewFilm(run), 8000); }, 6000);
  }
}

// ---------------------------------------------------------------- Your videos
async function viewVideos(){
  setSteps(-1);
  const app = $("#app");
  app.innerHTML = `<div class="head"><div><p class="proj">Library</p><h1>Your videos</h1><p class="sub">Everything made on this ComfyUI, newest first. Open one to watch it, fix shots, or edit its brief and resubmit.</p></div><a class="btn primary" href="#/new">New video</a></div><div class="vgrid" id="vg"><p class="muted">Loading…</p></div>`;
  try{
    const [runs, films] = await Promise.all([api("runs"), DEMO ? [] : realApi("films").catch(() => [])]);
    const filmCards = films.map(v => `<a class="vcard" href="#/film/${encodeURIComponent(v.run)}"><div class="th">${v.thumb ? `<img src="${esc(v.thumb)}" alt="" loading="lazy">` : ""}</div>
        <div class="bd"><div class="row" style="justify-content:space-between;gap:8px"><b style="font-size:14px">${esc(v.title || v.run)}</b><span class="badge ${v.video ? "ok" : "run"}">${v.video ? "Film" : "Rendering"}</span></div>
        <div class="tiny mono" style="margin-top:4px">${esc(String(v.when || "").replace("T"," "))} · ${esc(v.format || "")} · ${Math.round(v.seconds || 0)} s · ${v.shots} shots</div></div></a>`).join("");
    $("#vg").innerHTML = (runs.length || films.length) ? filmCards + runs.map(v => {
      const st = v.video ? ["ok","Done"] : (v.rendered ? ["run","Rendering"] : ["pre","Plan"]);
      return `<a class="vcard" href="#/run/${encodeURIComponent(v.run)}"><div class="th">${v.thumb ? `<img src="${esc(v.thumb)}" alt="" loading="lazy">` : ""}</div>
        <div class="bd"><div class="row" style="justify-content:space-between;gap:8px"><b style="font-size:14px">${esc(v.project || v.world || "House look")}</b><span class="badge ${st[0]}">${st[1]}</span></div>
        ${v.project ? `<div class="tiny clamp" style="margin-top:4px" title="${esc(v.world || "")}">${esc(v.world || "House look")}</div>` : ""}<div class="tiny mono" style="margin-top:4px">${esc(v.when.replace("T"," "))} · ${esc(v.format||"")} · ${v.seconds}s</div><div class="tiny" style="margin-top:2px;word-break:break-all">${esc(v.run)}</div></div></a>`;
    }).join("") : `<p class="muted">No videos yet. <a href="#/new">Make your first one.</a></p>`;
  }catch(e){ $("#vg").innerHTML = `<p class="banner">${esc(e.message)}</p>`; }
}

// ---------------------------------------------------------------- app icon
// The cnforge mark: a lowercase "cn" drawn in strokes on an ember tile.
const LOGO = id => `<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="${id}" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">` +
  `<stop offset="0" stop-color="#ffa067"/><stop offset=".55" stop-color="#ff7a2f"/><stop offset="1" stop-color="#e2501c"/></linearGradient></defs>` +
  `<rect width="32" height="32" rx="8" fill="url(#${id})"/>` +
  `<g fill="none" stroke="#130a04" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">` +
  `<path d="M14.2 12.6a4.6 4.6 0 1 0 0 6.8"/><path d="M17.6 21v-5.2a3.4 3.4 0 0 1 6.8 0V21"/></g>` +
  `<circle cx="25.2" cy="7.2" r="1.7" fill="#130a04"/></svg>`;
function drawIcon(){
  $("#mark").innerHTML = LOGO("lg");
  $("#fav").href = "data:image/svg+xml," + encodeURIComponent(LOGO("fg"));
}

drawIcon();
demoBar();
loadSystem();
$("#restart").onclick = restartComfy;
setInterval(loadSystem, 30000);
route();
</script>
